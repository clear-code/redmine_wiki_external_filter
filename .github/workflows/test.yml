name: Test
on:
  - push
  - pull_request
jobs:
  test:
    name: Redmine ${{ matrix.redmine-version }} & Ruby ${{ matrix.ruby-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - redmine-version: "6.0"
            ruby-version: "3.3"
          - redmine-version: "6.1"
            ruby-version: "3.3"
          - redmine-version: "6.1"
            ruby-version: "3.4"
          - redmine-version: "7.0"
            ruby-version: "3.3"
          - redmine-version: "7.0"
            ruby-version: "3.4"
          - redmine-version: "7.0"
            ruby-version: "4.0"
          - redmine-version: "master"
            ruby-version: "3.3"
          - redmine-version: "master"
            ruby-version: "3.4"
          - redmine-version: "master"
            ruby-version: "4.0"
    steps:
      - uses: actions/checkout@v2
      - name: Setup environment variables
        run: |
          case "${{ matrix.redmine-version }}" in
            master)
              echo "REDMINE_BRANCH=master" >> ${GITHUB_ENV}
              ;;
            *)
              echo "REDMINE_BRANCH=${{ matrix.redmine-version }}-stable" >> \
                ${GITHUB_ENV}
              ;;
          esac
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            graphviz \
            imagemagick \
            mysql-server \
            plantuml
      - name: Run MySQL
        run: |
          sudo systemctl start mysql
      - name: Reset MySQL's root password
        run: |
          sudo mysql \
            --defaults-file=/etc/mysql/debian.cnf \
            -e "ALTER USER 'root'@'localhost' \
                IDENTIFIED WITH caching_sha2_password BY ''"
      - name: Prepare Redmine
        run: |
          cd ..
          git clone \
            --depth 1 \
            --branch ${REDMINE_BRANCH} \
            https://github.com/redmine/redmine.git
          cd redmine
          cd plugins
          ln -s ../../redmine_wiki_external_filter wiki_external_filter
          cd ../
          cp config/database.yml{.example,}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/../redmine/Gemfile
      - name: Install
        run: |
          cd ../redmine
          bin/rails db:create
          bin/rails generate_secret_token
          bin/rails db:migrate
      - name: Enable Redmine's cache for test
        run: |
          cd ../redmine
          sed -i'' \
            -e 's/\(config\.action_controller\.perform_caching = \)false/\1true/g' \
            -e 's/\(config\.cache_store = \):null_store/\1:memory_store/g' \
            config/environments/test.rb
      - name: Test
        run: |
          cd ../redmine
          RAILS_ENV=test bin/rails redmine:plugins:test
